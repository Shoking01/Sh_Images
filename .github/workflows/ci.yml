name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux deps (rfd/GTK)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev
      - run: cargo check
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      # CONTRIBUTING.md lo exige y hasta ahora no se ejecutaba.
      - run: cargo test --release
      # Compila los benches sin ejecutarlos: los rompe cualquier cambio de API
      # y hoy nada los cubría.
      - run: cargo bench --no-run

  # La MSRV declarada en Cargo.toml no se verificaba en ningún sitio. Un backend
  # de medios es exactamente el tipo de dependencia que la sube sin avisar.
  msrv:
    name: msrv (1.92)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.92
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev
      - run: cargo check --all-targets
