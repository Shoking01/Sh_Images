name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-release:
    name: Build Windows Release (MSI)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2

      - name: Install WiX 3.14
        run: |
          $zipPath = "$env:TEMP\wix314-binaries.zip"
          Invoke-WebRequest -Uri "https://github.com/wixtoolset/wix3/releases/download/wix314rtm/wix314-binaries.zip" -OutFile $zipPath
          Expand-Archive -Path $zipPath -DestinationPath "C:\wix" -Force

      - name: Build release binary
        run: cargo build --release

      - name: Copy icon.ico to installer dir
        run: |
          $ico = Get-ChildItem -Recurse -Filter icon.ico target\release\build | Select-Object -First 1
          if (-not $ico) { throw "icon.ico no generado por build.rs" }
          Copy-Item $ico.FullName installer\windows\icon.ico

      - name: Build MSI
        working-directory: installer/windows
        env:
          VERSION: ${{ github.ref_name }}
          RELEASE_DIR: ..\..\target\release
        run: cmd /c build.cmd

      - name: Validate MSI artifact
        run: |
          $msi = Get-Item installer\windows\sh_images-*-x64.msi
          if (-not $msi) { throw "MSI was not generated" }
          if ($msi.Length -gt 30MB) {
            throw "MSI size $($msi.Length) exceeds 30MB limit"
          }
          Write-Host "MSI size: $([math]::Round($msi.Length / 1MB, 2)) MB"

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: sh_images-${{ github.ref_name }}-windows-x64-msi
          path: installer/windows/*.msi
          retention-days: 14

      # ===== NUEVO: Subir MSI al Release de GitHub =====
      - name: Upload MSI to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: installer/windows/*.msi
          name: Sh_Images ${{ github.ref_name }}
          body: |
            ## Sh_Images v0.2.0

            ### What's new
            - **Cursor-anchored zoom & pan** — zoom keeps the image point under the cursor fixed; drag to pan when zoomed in.
            - **Set as default image viewer** — register `ShImages.ImageViewer` on Windows (HKCU) and open the default apps settings page.
            - **Built-in editor** — crop with drag-on-viewer overlay; brightness, contrast, saturation sliders (-100..=100); filters: grayscale, sepia, invert, black & white; save as PNG, JPEG, BMP, WebP, or TIFF.
            - **English/Spanish UI** — all text routed through a Lang table; preference persisted in `settings.toml` (`language = "en"` or `"es"`). Selector under the gear menu (⚙).
            - **Unicode toolbar icons** — ◀ ▶ 🔄 ⊡ ⛶ ☰ ℹ ⏵ ✎ ⚙ ★ — clean and language-independent.
            - **Compact gear menu** — theme, shortcuts, default viewer, and language selector collapsed under ⚙.
            - **Default language: English** — fresh installs now start in English.

            ### Windows
            - `sh_images-v0.2.0-x64.msi` — MSI installer (x64)
            - File associations: `.png`, `.jpg`, `.jpeg`, `.bmp`, `.gif`, `.webp`, `.tif`, `.tiff`

            ### macOS / Linux
            - Download the binary from the workflow artifacts section.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-other-platforms:
    name: Build binaries (macOS, Linux)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: sh_images-${{ github.ref_name }}-${{ runner.os }}
          path: target/release/sh_images
          retention-days: 14
          if-no-files-found: warn

      # ===== NUEVO: Subir binarios al Release de GitHub =====
      - name: Upload binary to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: target/release/sh_images
          name: Sh_Images ${{ github.ref_name }}
          append_body: true
          body: |
            ### ${{ runner.os }}
            - `sh_images` — Release binary
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
