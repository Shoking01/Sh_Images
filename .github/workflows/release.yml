name: Release

on:
  push:
    branches: [main]
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Detect version from Cargo.toml and decide if we should release.
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      skip: ${{ steps.exists.outputs.skip }}
    steps:
      - uses: actions/checkout@v5

      - name: Extract version from Cargo.toml
        id: meta
        run: |
          VER=$(grep '^version = ' Cargo.toml | head -1 | sed 's/^version = "//;s/"$//')
          echo "version=$VER" >> $GITHUB_OUTPUT

      - name: Check if release already exists
        id: exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "v${{ steps.meta.outputs.version }}" >/dev/null 2>&1; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "Release v${{ steps.meta.outputs.version }} already exists — skipping."
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

  build-windows:
    name: Build Windows MSI
    needs: prepare
    if: needs.prepare.outputs.skip != 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # FFmpeg 7.1.1 shared (LGPL) runtime DLLs bundled into the MSI by Files.wxs.
      # Pinned build so avcodec-61 etc. always match what ffmpeg-sys-next links.
      - name: Download FFmpeg shared DLLs
        run: |
          $zipPath = "$env:TEMP\ffmpeg-n7.1.1-shared.zip"
          Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2025-06-30-13-55/ffmpeg-n7.1.1-54-g6400860b9d-win64-lgpl-shared-7.1.zip" -OutFile $zipPath
          New-Item -ItemType Directory -Force -Path "$env:TEMP\ffmpeg711", "target\release" | Out-Null
          tar -xf $zipPath -C "$env:TEMP\ffmpeg711"
          $bin = Get-ChildItem "$env:TEMP\ffmpeg711" -Directory | Select-Object -First 1
          foreach ($dll in "avcodec-61.dll","avformat-61.dll","avutil-59.dll","swresample-5.dll","swscale-8.dll") {
            Copy-Item "$($bin.FullName)\bin\$dll" target\release\ -ErrorAction Stop
          }
          Write-Host "FFmpeg DLLs staged:"; Get-ChildItem target\release\*.dll | ForEach-Object { $_.Name }

      - name: Ensure libclang for bindgen
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\Program Files\LLVM\bin\libclang.dll")) {
            choco install llvm -y --no-progress
          } else {
            Write-Host "LLVM already present"
          }

      - name: Install WiX 3.14
        run: |
          $zipPath = "$env:TEMP\wix314-binaries.zip"
          Invoke-WebRequest -Uri "https://github.com/wixtoolset/wix3/releases/download/wix314rtm/wix314-binaries.zip" -OutFile $zipPath
          Expand-Archive -Path $zipPath -DestinationPath "C:\wix" -Force

      - name: Build release binary
        run: cargo build --release --features video

      - name: Copy icon.ico to installer dir
        run: |
          $ico = Get-ChildItem -Recurse -Filter icon.ico target\release\build | Select-Object -First 1
          if (-not $ico) { throw "icon.ico no generado por build.rs" }
          Copy-Item $ico.FullName installer\windows\icon.ico

      - name: Build MSI
        working-directory: installer/windows
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_DIR: ..\..\target\release
        run: cmd /c build.cmd

      - name: Validate MSI
        run: |
          $msi = Get-Item installer\windows\sh_images-*-x64.msi
          if (-not $msi) { throw "MSI was not generated" }
          # FFmpeg DLLs (~110 MB raw, cab-compressed) put the MSI in the 60-90 MB band (REQ-FF-012).
          if ($msi.Length -lt 40MB) { throw "MSI too small ($($msi.Length)) — FFmpeg DLLs probably missing" }
          if ($msi.Length -gt 150MB) { throw "MSI size $($msi.Length) exceeds 150MB limit" }
          Write-Host "MSI OK: $([math]::Round($msi.Length / 1MB, 2)) MB"

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: msi-windows-x64
          path: installer/windows/sh_images-*-x64.msi
          retention-days: 14

  build-linux:
    name: Build Linux binary
    needs: prepare
    if: needs.prepare.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install system deps
        # Linux/macOS ship WITHOUT video playback for now (image viewer core
        # works; enabling it needs libav*-dev at build AND runtime .so bundling
        # — tracked as follow-up in the ffmpeg archive report).
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libclang-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libegl-mesa0 \
            libgl1-mesa-dri

      - name: Build release binary (no video on Linux for now)
        run: cargo build --release

      - name: Rename binary for upload
        run: mv target/release/sh_images target/release/sh_images-linux-x64

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-linux-x64
          path: target/release/sh_images-linux-x64
          retention-days: 14

  build-macos:
    name: Build macOS binary
    needs: prepare
    if: needs.prepare.outputs.skip != 'true'
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install system deps
        # macOS binary ships without video playback for now (see Linux note).
        run: cargo build --release

      - name: Rename binary for upload
        run: mv target/release/sh_images target/release/sh_images-macos-x64

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-macos-x64
          path: target/release/sh_images-macos-x64
          retention-days: 14

  # Create the GitHub Release once all builds succeed.
  release:
    name: Create GitHub Release
    needs: [prepare, build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Extract changelog section for this version
        id: changelog
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          # Pull out the block that starts with "## [x.y.z]" up to the next "##"
          awk -v ver="## \\[${VERSION}\\]" '
            $0 == ver {p=1; next}
            /^## / && p {p=0}
            p {print}
          ' CHANGELOG.md > release_notes.md
          echo "--- Release notes ---"
          cat release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          name: Sh_Images v${{ needs.prepare.outputs.version }}
          body_path: release_notes.md
          make_latest: true
          files: |
            msi-windows-x64/*.msi
            binary-linux-x64/sh_images-linux-x64
            binary-macos-x64/sh_images-macos-x64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
