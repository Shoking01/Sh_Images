[package]
name = "sh_images"
version = "0.2.4"
edition = "2021"
# MSRV: eframe/egui 0.35 requieren Rust 1.92 (ver ADR-005).
rust-version = "1.92"
# build.rs genera assets/icon.ico desde assets/icon.svg.
build = "build.rs"

# Release profile optimizado para tamaño (AGENTS.md §6.1: binario <20MB).
# strip elimina symbols, lto=true + codegen-units=1 permiten cross-module opts.
[profile.release]
codegen-units = 1
lto = true
strip = true

[lib]
name = "sh_images"
path = "src/lib.rs"

[[bin]]
name = "sh_images"
path = "src/main.rs"

[[bench]]
name = "opening"
harness = false

[[bench]]
name = "navigation"
harness = false

[[bench]]
name = "thumbnail_gen"
harness = false

[[bench]]
name = "image_cache"
harness = false

[[bench]]
name = "preload"
harness = false

[[bench]]
name = "video_timeline"
harness = false

[features]
# Video backend: FFmpeg SW decode (Slice1). HW accel slice2 behind hwaccel.
default = []
video = ["dep:ffmpeg-next"]
hwaccel = ["video"]

[dependencies]
once_cell = "1.19"# FFmpeg 7.x dynamic LGPL — Slice1 SW decode. Optional so `cargo test` without
# FFmpeg dev libs still passes; `cargo test --features video` probes real DLLs.
# Minimal feature set: default pulls avfilter+avdevice which we never use and
# whose .pc files would be required at build time (CI video-decode failure).
ffmpeg-next = { version = "7", optional = true, default-features = false, features = [
    "codec",
    "format",
    "software-resampling",
    "software-scaling",
] }
# GUI — eframe/egui: framework immediate-mode nativo, fijado por Plan.md.
# NOTA: el backend por defecto (wgpu) produce un binario >20MB. Ver ADR-001.
eframe = "0.35"
egui = "0.35"
# Diálogo de archivos nativo (abrir imágenes) — justificación: estándar en el
# ecosistema egui, nativo por plataforma, mantenido, licencia MIT/Apache-2.0
# (AGENTS.md §7.2).
rfd = "0.15"
# Decodificación de imágenes — justificación: benchmark base y Fase 1.
image = "0.25"
# Metadatos EXIF (JPEG/TIFF) — licencia BSD-2-Clause (AGENTS.md §7.2),
# estándar del ecosistema, recomendado por Plan.md §6.
kamadak-exif = "0.6.1"
# Serialización de configuración TOML.
serde = { version = "1", features = ["derive"] }
toml = "1"
# Sistema de errores centralizado (AGENTS.md §3.3).
thiserror = "2"
# Logging estructurado (AGENTS.md §7.3).
tracing = "0.1"
tracing-subscriber = "0.3"

[dev-dependencies]
# Benchmarks de rendimiento.
criterion = { version = "0.5", features = ["html_reports"] }
# Archivos temporales en tests de I/O (AGENTS.md §4.3).
tempfile = "3"
# Snapshot testing de estado/lógica UI (AGENTS.md §4.4, Plan.md Fase 3).
insta = { version = "1", features = ["yaml"] }

[build-dependencies]
# Icon rendering at build time (Fase 5). SVG → PNG → .ico.
# resvg re-exporta usvg+tiny-skia internamente y expone render().
resvg = { version = "0.43", default-features = false }
ico = "0.5"
# Windows only: embed icon into .exe (needs rc.exe on MSVC toolchain).
[target.'cfg(windows)'.build-dependencies]
winres = "0.1"
# Windows only: registry access for file associations (default viewer),
# Media Foundation para decodificación de video y cpal para la salida de audio.
[target.'cfg(windows)'.dependencies]
winreg = "0.52"
# Media Foundation — justificación (AGENTS.md §7.2): licencia MIT OR Apache-2.0,
# mantenido por Microsoft, y el crate `windows` YA está en el grafo de forma
# transitiva vía wgpu-hal/gpu-allocator/accesskit_windows, así que activar estas
# features no añade ningún crate nuevo. Se usa el códec que Windows ya trae: no
# distribuimos decodificadores, lo que evita tanto el peso (gate de 30 MB del
# MSI) como la exposición a patentes de H.264.
# El delay-load de mfplat.dll en build.rs es obligatorio: las ediciones "N" de
# Windows no traen Media Foundation y un import estático impediría arrancar.
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    # SetCurrentPosition y GetPresentationAttribute están gateadas tras estas
    # dos: devuelven/aceptan PROPVARIANT.
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_System_LibraryLoader",
    # PropVariantToUInt64, usado para leer MF_PD_DURATION.
    "Win32_UI_Shell_PropertiesSystem",
] }
# Salida de audio (WASAPI en Windows) — licencia Apache-2.0, estándar del
# ecosistema. El volumen se aplica escalando PCM, no tocando el mezclador.
cpal = "0.16"

# Vendored ffmpeg-sys-next: layout_tests(false) — on MSVC a few FFmpeg structs
# fall back to opaque in bindgen and the default layout asserts fail with E0080.
# See vendor/ffmpeg-sys-next/build.rs and docs/licenses.md. Harmless on CI/Linux
# (asserts are ABI drift checks, not correctness).
[patch.crates-io]
ffmpeg-sys-next = { path = "vendor/ffmpeg-sys-next" }
